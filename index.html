<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATalog</title>
    <link rel="stylesheet" href="style.css">
     <script src="../ARGD4160P2fsfs/index.js" type="text/javascript" defer></script>
     <link rel="stylesheet" href="https://use.typekit.net/uln7ewe.css">

</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <h1>CATalog</h1>
            <p class="subtitle">meow meow meow</p>
        </div>
    </header>

    <main class="main-content">
        <!-- Controls Toolbar -->
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by name or breed...">
            </div>
            
            <div class="filter-group">
                <select id="genderFilter">
                    <option value="">All Genders</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>

                <select id="breedFilter">
                    <option value="">All Breeds</option>
                </select>

                <select id="sortSelect">
                    <option value="name-asc">Sort by Name (A-Z)</option>
                    <option value="age-asc">Sort by Age (Youngest)</option>
                    <option value="age-desc">Sort by Age (Oldest)</option>
                </select>
            </div>

            <div class="view-toggles">
                <button id="cardViewBtn" class="toggle-btn active" title="Card View">Grid</button>
                <button id="tableViewBtn" class="toggle-btn" title="Table View">Table</button>
            </div>
        </div>

        <!-- Counter display -->
        <div class="stats-bar">
            Showing <span id="recordCount">0</span> meow meows
        </div>

        <!-- Card Container View -->
        <div id="cardContainer" class="card-grid"></div>

        <!-- Table Container View -->
        <div id="tableContainer" class="table-container hidden">
            <table class="archive-table">
                <thead>
                    <tr>
                        <th>Specimen</th>
                        <th>Name</th>
                        <th>Gender</th>
                        <th>Breed</th>
                        <th>Age</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 CATalog. meow meow meow.</p>
    </footer>

    <script src="index.js"></script>
</body>
</html>
