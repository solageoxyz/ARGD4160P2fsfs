<p>
  <label for="word-input">text</label>

</p>

<p>
  <label for="face-color">face color</label>

  <output for="face-color"></output>
</p>

<p>
  <label for="left-eye-x">left eye x</label>

  <input id="left-eye-y" type="range" min="0" max="400" value="110" />
</p>

<p>
  <label for="right-eye-x">right eye x</label>

  <label for="right-eye-y">right eye y</label>
  <input id="right-eye-y" type="range" min="0" max="400" value="110" />
</p>

<p>
  <label for="mouth-scale">mouth scale</label>
  <input id="mouth-scale" type="range" min="0.1" max="3" step="0.1" value="1" />
  <output for="mouth-scale"></output>
</p>
