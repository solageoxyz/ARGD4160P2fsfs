<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATalog 🐾</title>
    <!-- Cute Google Fonts: Fredoka for headers & Quicksand for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <h1><span>🐈‍⬛</span> CATalog <span>🐾</span></h1>
            <p class="subtitle">meow meow meow</p>
        </div>
    </header>

    <main class="main-content">
        <!-- Controls  -->
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search kitty name or breed...">
            </div>
            
            <div class="filter-group">
                <select id="genderFilter">
                    <option value="">All Genders</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>

                <select id="breedFilter">
                    <option value="">All Breeds</option>
                </select>

                <select id="sortSelect">
                    <option value="name-asc">Sort by Name (A-Z)</option>
                    <option value="age-asc">Sort by Age (Youngest)</option>
                    <option value="age-desc">Sort by Age (Oldest)</option>
                </select>
            </div>

            <div class="view-toggles">
                <button id="cardViewBtn" class="toggle-btn active" title="Card View">🐾 Grid</button>
                <button id="tableViewBtn" class="toggle-btn" title="Table View">📋 Table</button>
            </div>
        </div>

        <div class="stats-bar">
             Showing <span id="recordCount">0</span>  meow meows 
        </div>

        <div id="cardContainer" class="card-grid"></div>

        <div id="tableContainer" class="table-container hidden">
            <table class="archive-table">
                <thead>
                    <tr>
                        <th>Specimen</th>
                        <th>Name</th>
                        <th>Gender</th>
                        <th>Breed</th>
                        <th>Age</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </main>


    <div id="catModal" class="modal hidden">
        <div class="modal-image-box">
            <button id="closeModal" class="close-btn">&times;</button>
            <img id="modalImage" src="" alt="Full size cat">
            <div id="modalCaption" class="modal-caption"></div>
        </div>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 CATalog. Meow meow meow.</p>
    </footer>

    <script src="index.js"></script>
</body>
</html>
